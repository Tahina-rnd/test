
http {
    server {
        listen 8080;
        server_name alpha.local;
        root www/site1;
        index index.html;

        location / {
            allow_methods GET;
            root www/site1;
        }
    }

    server {
        listen 8080;
        server_name beta.local;
        root www/site2;
        index index.html;

        location / {
            allow_methods GET;
            root www/site2;
        }
    }
}
