http {
    server {
        listen 8080;
        server_name site1;
        root www/site1;
        index index.html;
        client_max_body_size 1M;

        location / {
            allow_methods GET POST DELETE;
            root www/site1;
            autoindex off;
            index index.html;
        }
    }

    server {
        listen 8081;
        server_name site2;
        root www/site2;
        index index.html;
        client_max_body_size 1M;

        location / {
            allow_methods GET;
            root www/site2;
            index index.html;
        }

    }

    server {
        listen 8082;
        server_name site2;
        root www/site2;
        index index.html;
        client_max_body_size 1M;

        location / {
            allow_methods GET;
            root www/site2;
            autoindex on;
            index index.html;
        }
    }
}
