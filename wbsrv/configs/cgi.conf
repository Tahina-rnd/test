http {
    server {
        listen 8080;
        server_name localhost;
        root www/site1;
        index index.html;
        client_max_body_size 2M;
        error_page 404 /errors/404.html;

        location / {
            allow_methods GET;
            root www/site1;
            index index.html;
        }

        location /cgi-bin {
            allow_methods GET POST;
            root www/site1;
            cgi_ext .py;
            cgi_pass /usr/bin/python3;
        }
    }
}
